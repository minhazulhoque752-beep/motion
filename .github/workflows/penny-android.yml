name: Penny Android build

on:
  push:
    paths:
      - "penny/**"
      - ".github/workflows/penny-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: penny
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign release builds with your own key. Add these repository secrets to enable:
      # PENNY_KEYSTORE_BASE64, PENNY_KEYSTORE_PASSWORD, PENNY_KEY_ALIAS, PENNY_KEY_PASSWORD
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.PENNY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PENNY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PENNY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PENNY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Release builds will be signed with your release key."
          else
            echo "No release key configured; release APK is signed with the project's debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/penny-${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/penny-${{ github.run_number }}-release.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: penny-apks-${{ github.run_number }}
          path: |
            penny/dist/*.apk
            penny/app/build/reports/lint-results-debug.html
            penny/app/build/reports/tests/

      - name: Publish downloadable pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: penny-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Penny build ${{ github.run_number }}
          prerelease: true
          body: |
            Penny Android APKs built from ${{ github.sha }}.
            - `penny-${{ github.run_number }}-release.apk` — optimised build (install this one)
            - `penny-${{ github.run_number }}-debug.apk` — debug build (separate app id, for testing)
          files: penny/dist/*.apk
